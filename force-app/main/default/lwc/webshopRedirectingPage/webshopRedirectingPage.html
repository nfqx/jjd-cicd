<template>
    <c-webshop-toast></c-webshop-toast>
    <div class="container text-center mt-5" if:true={showData}>
        <div class="card p-4 shadow-lg">
            <h2 class="text">{label.VerificationSuccess}</h2>
            <c-webshop-password onchangepassword={handleChangePassword}></c-webshop-password>
            <template if:false={pwdSuccess}>
                <button class="btn btn-outline-dark" onclick={handleSavePassword} disabled={passwordDisabled}>{label.save}</button>
            </template>
            <template if:true={pwdSuccess}>
                <p class="lead">{label.RedirectionMsg1}<span>&nbsp;{countdown}&nbsp;</span>{label.RedirectionMsg2}</p>
            </template>
        </div>
    </div>
</template>
