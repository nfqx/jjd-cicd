<template>
    <c-webshop-toast></c-webshop-toast>
    <div class="background"></div>
    <div class="sidebar d-none d-lg-block">
        <c-webshop-my-area-sidebar active-element="My_Outlets__c"></c-webshop-my-area-sidebar>
    </div>
    <div class="container-fluid content-zone">
        <div class="row"> 
            <div class="col-auto d-none d-lg-block">
                <!--c-webshop-my-area-sidebar active-element="My_Outlets__c"></c-webshop-my-area-sidebar-->
            </div>
            <div class="col-12 col-lg-11 p-0 px-md-4">
                <div class="content-area">
                    <div class="d-flex flex-row flex-wrap justify-content-between align-items-start mb-3">
                        <div class="col-12 col-lg-9"> 
                            <p class="heading-2">{label.myOutlets}</p> 
                            <p class="body-regular">{label.myOutletsSubtitle}</p>
                        </div>
                        <button class="col-12 col-lg-3 btn btn-link link d-flex justify-content-start justify-content-lg-end align-items-center" 
                                type="button" onclick={handleClickBackToShop}>
                            <i class="bi bi-arrow-left"></i>&nbsp;{label.backToShop}
                        </button> 
                    </div>
                    <div class="d-flex justify-content-center align-items-center">
                        <div if:true={isLoading} class="spinner-border text-black-50" role="status"></div>
                    </div>
                    <!--lightning-spinner if:true={isLoading} alternative-text="Loading" size="small"></lightning-spinner-->
                    <template if:false={isLoading}>
                        <input class="form-control mb-3" type="text" placeholder={label.searchOutlet} onchange={changeSearchTerm} />
                        <template for:each={displayedOutlets} for:item="outlet">
                        <div key={outlet.Id} class="col-12 bg-white rounded p-3 mb-3 d-flex justify-content-between align-content-start">
                            <div class="d-flex flex-column ">
                            <p class="large-medium m-0 d-flex align-items-center">
                                {outlet.AccountNumber} {outlet.Name}
                                <span if:false={outlet.isActive} class="bg-primary-subtle border border-primary rounded text-dark components-badge-h6 p-1 ms-2" style="cursor:pointer;" data-recordid={outlet.Id} data-recordname={outlet.Name} onclick={handleSwitchAccount}>{label.switchAccount}</span>
                                <span if:true={outlet.isActive} class="bg-primary-subtle border border-primary rounded text-dark components-badge-h6 p-1 ms-2">{label.active}</span>
                            </p> 
                            <p class="body-regular gray-700">{outlet.Street}, {outlet.PostalCode} {outlet.City}</p>
                            </div>
                            <button onclick={handleClickOutlet} class="btn btn-link text-decoration-none text-dark" data-outletid={outlet.Id}>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                        </template>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
