<template>
    <c-webshop-toast></c-webshop-toast>
    <div class="container">
        <div class="card">
            <template if:false={success}>
                <h1>{label.changeYourPassword}</h1>
                <p>{label.changeYourPasswordMsg}</p>
                <c-webshop-password onchangepassword={handleChangePassword}></c-webshop-password>
                <button class="btn btn-outline-dark" onclick={handleSavePassword} disabled={passwordDisabled}>{label.save}</button>
            </template>
            <template if:true={success}>
                <h1>{label.success}</h1>
                <p>{label.changeYourPasswordSuccessMsg}</p>
            </template>
        </div>
    </div>
</template>
