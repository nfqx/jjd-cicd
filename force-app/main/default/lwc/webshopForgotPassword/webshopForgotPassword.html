<template>
  <c-webshop-toast></c-webshop-toast>
  <div class="d-flex justify-content-center align-items-center m-auto">
    <div if:true={isLoading}  class="spinner-border text-black-50" role="status"></div>
  </div>
  <template if:false={isLoading}>
      <div class="modal d-flex flex-column justify-content-center align-items-center">
          <div class="modal-card border-black rounded p-4" if:false={showSuccess}>
                <!--div class="bg-secondary-subtle border-secondary rounded mb-4 p-2 w-100" if:true={showError}> 
                  <h3 class="heading-6 m-0"><i class="bi bi-x-circle text-danger me-2"></i>{label.ERROR}</h3>
                  <p class="body-regular m-0">{label.ErrorMsg}</p>
                </div-->
                <div> 
                  <h1 class="heading-2 text-align-center">{label.ForgotYourPassword}</h1>
                  <p class="body-regular gray-700 text-align-center">{label.EnterYourEmail}</p>
                </div>
                <div>
                  <p class="body-regular">{label.USERNAME}</p>
                  <input class="form-control" type="username" onchange={handleUsernameChange}></input>
                </div>
                <button type="button" onclick={handleResetPassword} class="btn btn-primary my-3">{label.PasswordResetButtonLabel}</button>
                <div class="d-flex flex-row justify-content-between">  
                    <p class="body-regular gray-700"> {label.NewToDarbovenQuestion}</p>
                    <a href="/SelfRegister" class="link">{label.CreateYourAccount}</a>
                </div> 
          </div>
          <a href="/login" class="link mt-3" if:false={showSuccess}>{label.BackToLogin}</a>
    
          <div class="modal-card p-4" if:true={showSuccess}>
              <h1 class="heading-2 text-align-center">{label.PasswordResetSuccess}</h1>
              <p class="body-regular text-align-center">{passwordResetSuccessMsg}</p>
              <button type="button" onclick={resend} class="btn btn-link link my-3" disabled={resendDisabled}>{label.resend}</button>
          </div>
      </div>
    </template>
</template>
