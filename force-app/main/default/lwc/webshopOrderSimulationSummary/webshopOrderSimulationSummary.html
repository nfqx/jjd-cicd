<template>
    <template if:true={readyLoaded}>
        {showPrices}
        <template if:true={erpFailed}>
            {label.errorDesc}: {errorLoggingId}
        </template>
        <template if:true={erpSucceeded}>
            <template if:false={_erpResult.hasSuccessfulItems}>
                <p class="body-regular">{label.emptyCart}</p>
            </template>
            <template if:true={_erpResult.hasSuccessfulItems}>
                <template for:each={_erpResult.successfulItems} for:item="cartItem">
                    <div class="row d-flex justify-content-between border-bottom py-3" key={cartItem.cartItem.Id}>
                        <!--lightning-spinner if:true={isLoadingInner} alternative-text="Loading" size="small"></lightning-spinner-->
                        <div class="col-4 col-md-2">
                            <div if:true={cartItem.hasImage}><img src={cartItem.cartItem.Product2.WebshopImageURL__c} class="cart-product-image cursor-pointer" alt={cartItem.cartItem.Product2.Name} data-productid={cartItem.cartItem.Product2Id} onclick={handleNavigateToProduct}></div>
                        </div>
                        <div class="col-8 col-md-4">
                            <p class="body-medium mb-1 cursor-pointer hover-underline" data-productid={cartItem.cartItem.Product2.Id} onclick={handleNavigateToProduct}>{cartItem.cartItem.Product2.Name}</p>
                            <p class="body-small gray-700">{cartItem.cartItem.Product2.ProductSubtitle__c}</p>
                            <p class="body-small gray-700">{cartItem.cartItem.Product2.PackageUnit__c}</p>
                        </div>
                        <div class="col-8 col-md-4">
                            <div class="d-flex justify-content-md-center justify-content-between align-items-center p-0">
                                <p class="components-badge-h3" if:true={showPrices}>
                                    <template if:true={cartItem.hasPromotion}>
                                        <template if:false={cartItem.freeItem}>
                                            <!--span style="text-decoration: line-through; font-size: 0.8rem;">{cartItem.cartItem.TotalLineAmount}&nbsp;{cartItem.cartItem.CurrencyIsoCode}</span>&nbsp;{cartItem.cartItem.TotalAmount}&nbsp;{cartItem.cartItem.CurrencyIsoCode}
                                            <br /><span style="text-align: right; font-size: 0.8rem;">({cartItem.cartItem.TotalPromoAdjustmentAmount}&nbsp;{cartItem.cartItem.CurrencyIsoCode})</span-->
                                            <template if:false={cartItem.differentAmounts}>
                                                {cartItem.cartItem.TotalLineAmountRounded}&nbsp;{cartItem.orderItem.CurrencyIsoCode}
                                            </template>
                                            <template if:true={cartItem.differentAmounts}>
                                                <span style="text-decoration: line-through">{cartItem.cartItem.TotalLineAmountRounded}&nbsp;{cartItem.cartItem.CurrencyIsoCode}</span>&nbsp;{cartItem.orderItem.TotalPriceRounded}&nbsp;{cartItem.orderItem.CurrencyIsoCode}
                                            </template>
                                        </template>
                                        <template if:true={cartItem.freeItem}>
                                            <span>{label.free}</span>
                                        </template>
                                    </template>
                                    <template if:false={cartItem.hasPromotion}>
                                        <template if:false={cartItem.freeItem}>
                                            <template if:false={cartItem.differentAmounts}>
                                                {cartItem.cartItem.TotalLineAmountRounded}&nbsp;{cartItem.orderItem.CurrencyIsoCode}
                                            </template>
                                            <template if:true={cartItem.differentAmounts}>
                                                <span style="text-decoration: line-through">{cartItem.cartItem.TotalLineAmountRounded}&nbsp;{cartItem.cartItem.CurrencyIsoCode}</span>&nbsp;{cartItem.orderItem.TotalPriceRounded}&nbsp;{cartItem.orderItem.CurrencyIsoCode}
                                            </template>
                                        </template>
                                        <template if:true={cartItem.freeItem}>
                                            <span>{label.free}</span>
                                        </template>
                                    </template>
                                </p>
                            </div>
                            <div class="d-flex justify-content-md-center justify-content-between align-items-center p-0">
                                <div class="d-inline-flex input-group-sm"> 
                                    <div class="input-group-prepend align-items-center justify-content-center">
                                        <template if:true={showPrices}>
                                            {cartItem.orderItem.Quantity} x {cartItem.orderItem.UnitPriceRounded}&nbsp;{cartItem.orderItem.CurrencyIsoCode}
                                        </template>
                                        <template if:false={showPrices}>
                                            {label.quantity} {cartItem.orderItem.Quantity}
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <p class="d-flex justify-content-between body-regular mt-2" if:true={hasPromotions}><span>{label.promotions}</span><span>{promotionsTotal}</span></p>
                <template if:true={showPrices}>
                    <p class="d-flex justify-content-between body-regular mt-2">
                        <span>{label.subtotal}</span>
                        <template if:false={_erpResult.hasTotalPriceDifference}>
                            <span>{_erpResult.order.TotalAmountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span>
                        </template>
                        <template if:true={_erpResult.hasTotalPriceDifference}>
                            <span><span style="text-decoration: line-through">{_erpResult.TotalCartAmountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span>&nbsp;{_erpResult.order.TotalAmountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span>
                        </template>
                    </p>
                    <p class="d-flex justify-content-between body-regular mt-2">
                        <span>{label.shipping}</span>
                        <span>{_erpResult.order.ShippingCostsRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span>
                    </p>
                    <p class="d-flex justify-content-between body-regular mt-2"><span>{label.totalTax}</span><span>{_erpResult.order.TotalTaxAmountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span></p>
                    <template if:true={_erpResult.hasTaxItems}>
                        <div class="border-top">
                            <template for:each={_erpResult.taxItems} for:item="taxItem">
                                <template if:true={taxItem.hasTax}>
                                    <p class="d-flex justify-content-between body-regular mt-2" key={taxItem.taxRate}><span>{taxItem.taxRateRounded} %</span><span>{taxItem.taxTotalAmountRounded}&nbsp;{taxItem.currencyIsoCode}</span></p>
                                </template>
                            </template>
                        </div>
                    </template>
                    <div class="border-top">
                        <p class="d-flex justify-content-between components-badge-h2 pt-3"><span>{label.total}</span><span>{_erpResult.order.GrandTotalAmountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span></p>
                    </div>
                </template>
            </template>
            <template if:true={_erpResult.hasPaymentTerms}>
                <template if:true={_erpResult.hasActualPaymentTerms}>
                    <div class="row d-flex justify-content-between border-bottom py-3" style="background: white;">
                        <p>{label.paymentTerms}</p>
                        <p>{paymentTermsLineOne}</p>
                    </div>
                    <template if:true={showPrices}>
                        <div class="border-top">
                            <p class="d-flex justify-content-between components-badge-h2 pt-3"><span>{paymentTermsLineTwo}</span><span>- {_erpResult.order.GrandTotalAmountDiscountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span></p>
                        </div>
                        <div class="border-top">
                            <p class="d-flex justify-content-between components-badge-h2 pt-3"><span>{label.amountPayableEarly}</span><span>{_erpResult.order.GrandTotalAmountAfterDiscountRounded}&nbsp;{_erpResult.order.CurrencyIsoCode}</span></p>
                        </div>
                    </template>
                </template>
                <template if:false={_erpResult.hasActualPaymentTerms}>
                    {label.genericPaymentTerms}
                </template>
            </template>
        </template>
    </template>
</template>
