<template>
    <c-webshop-toast></c-webshop-toast>
    <div class="container-fluid bg-white">
        <div class="row">
            <div class="header-logo col-3 d-flex justify-content-start align-items-center ms-3 d-none d-md-block">
                <img src={jjdLogo} alt="J.J. Darboven Logo" class="img-fluid" />
            </div>
            <div class="col-12 col-md-6 progress-container d-flex flex-column justify-content-end">
                <div class="progress" style="height: 6px;"> 
                    <div 
                        class="progress-bar bg-dark" 
                        role="progressbar" 
                        aria-valuenow="0" 
                        aria-valuemin="0" 
                        aria-valuemax="100" 
                        style="width: 0%;">
                    </div>
                </div>
                <div class="body-regular d-flex justify-content-between mt-2">
                    <p>{label.AccountNumber}</p>
                    <p>{label.CompanyDetails}</p>
                    <p>{label.PersonalDetails}</p>
                </div>
            </div>
            <div class="col-2 d-flex justify-content-end align-items-center">
                <!--button class="btn btn-link" aria-label="Close">
                    <i class="bi bi-x-lg x text-dark"></i>
                </button-->
            </div>
        </div>      
    </div>
    <div class="d-flex justify-content-center align-items-center">
        <div if:true={isLoading}  class="spinner-border text-black-50" role="status"></div>
    </div>
    <template if:false={isLoading}>
        <div class="container-fluid" if:true={stepOne}>
            <!-- Step Two - Invalid Account Number -->
            <div class="row">
                <div class="col-12 col-md-6 left-section px-0 px-md-4">
                    <div class="my-3">
                        <a href="./login">
                            <i class="bi bi-arrow-left text-dark"></i>
                        </a>
                    </div>
                    <div class="mb-3">
                        <h1 class="heading-2">{label.Registration}</h1>
                        <p class="body-regular gray-700">{label.RegistrationMessage}</p>
                    </div>
                    <div class="bg-secondary-subtle border-secondary rounded mb-4 p-2 w-100 d-flex flex-row" if:true={invalidNumber}> 
                        <i class="bi bi-x-circle text-danger me-2"></i>
                        <p class="body-regular m-0">
                            {label.ErrorMsg}
                            {label.cantFindCustomer} <a href={contactEmailMailto}>{label.contactEMail}</a>
                        </p>
                    </div>
                    <div>
                        <label for="accountNumber" class="form-label body-regular">{label.AccountNumber}</label>
                            <input type="text" id="accountNumber" onkeyup={handleChangeAccountNumber} onchange={handleChangeAccountNumber} class="form-control mb-3" />
                        <label for="email" class="form-label body-regular">{label.email}</label>
                            <input type="text" id="email" onkeyup={handleChangeEmail} onchange={handleChangeEmail} class="form-control mb-3" />
                    </div>
                    <button class="btn btn-primary w-100 my-3" disabled={submitDisabled} onclick={handleSubmitAccountNumber}>{label.Continue}</button>
                    <div class="rounded border p-3 m-4 d-flex flex-column justify-content-center" >
                        <p class="text-start body-regular">{label.NotACustomerMessage}</p>
                        <a href="#" class="text-start link" onclick={handleOpenContactModal}>
                            {label.ContactUsButtonLabel}
                          <span>
                            <i class="bi bi-arrow-right"></i>
                          </span>
                        </a> 
                      </div>
                </div>
                <div class="col-md-6 d-none d-md-block right-section">
                    <!-- Placeholder for future marketing content -->
                </div>
            </div>
        </div>
        <!-- Step Two - Account already exists -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepTwoSuccess}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.successHeader}</p>
                <p class="body-regular gray-700">{successBodyFormatted}</p>
                <p class="body-regular gray-700">{label.successBody2}</p>
                <p class="link" onclick={handleResendEmail}>{label.sendEmailAgain}</p>
            </div>
        </div>
        <!-- Step Two - Account already exists -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepTwoAccountExists}>
            <div class="modal-card p-5 text-align-center">
            <p class="heading-2">{label.alreadyInUseHeader}</p>
            <p class="body-regular gray-700">{label.existingAccountFound}</p>
            <p class="body-regular gray-700">{label.tryToLoginOrContactSupport}</p>
            <button class="btn btn-primary w-100 mb-2" onclick={handleGoToLogin}>{label.login}</button> 
            <button class="btn btn-secondary w-100" onclick={handleOpenContactModal}>{label.contactEcommerceSupport}</button> 
            </div>
        </div>
    </template>
    <c-webshop-contact-modal anonymous lite-options></c-webshop-contact-modal>
</template>
