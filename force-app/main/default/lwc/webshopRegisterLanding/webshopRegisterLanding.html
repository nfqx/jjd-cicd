<template>
    <c-webshop-toast></c-webshop-toast>
    <div class="container-fluid bg-white">
        <div class="row">
            <div class="header-logo col-3 d-flex justify-content-start align-items-center ms-3 d-none d-md-block">
                <!--img src={jjdLogo} alt="J.J. Darboven Logo" class="img-fluid" /-->
                &nbsp;
            </div>
            <!--Company Details-->
            <div class="col-12 col-md-6 progress-container d-flex flex-column justify-content-end" if:true={stepOne}>
                <div class="progress" style="height: 6px;"> 
                    <div 
                        class="progress-bar bg-dark" 
                        role="progressbar" 
                        aria-valuenow="50" 
                        aria-valuemin="0" 
                        aria-valuemax="100" 
                        style="width: 50%;">
                    </div>
                </div>
                <div class="body-regular d-flex justify-content-between mt-2">
                    <p>{label.AccountNumber}</p>
                    <p>{label.CompanyDetails}</p>
                    <p>{label.PersonalDetails}</p>
                </div>
            </div>
            <!--Personal Details-->
            <div class="col-12 col-md-6 progress-container d-flex flex-column justify-content-end" if:true={stepTwo}>
                <div class="progress" style="height: 6px;"> 
                    <div 
                        class="progress-bar bg-dark" 
                        role="progressbar" 
                        aria-valuenow="100" 
                        aria-valuemin="0" 
                        aria-valuemax="100" 
                        style="width: 100%;">
                    </div>
                </div>
                <div class="body-regular d-flex justify-content-between mt-2">
                    <p>{label.AccountNumber}</p>
                    <p>{label.CompanyDetails}</p>
                    <p>{label.PersonalDetails}</p>
                </div>
            </div>
            <!--div class="col-2 d-flex justify-content-end align-items-center">
                <button class="btn btn-link" aria-label="Close">
                    <i class="bi bi-x-lg x text-dark"></i>
                </button>
            </div-->
        </div>      
    </div>
    <div class="d-flex justify-content-center align-items-center">
        <div if:true={isLoading}  class="spinner-border text-black-50" role="status"></div>
    </div>
    <template if:false={isLoading}>
        <div class="container-fluid" if:true={stepOne}>
            <div class="row" >
                <div class="col-12 col-md-6 left-section mt-5">
                    <template if:true={verified}>
                        <h2 class="heading-2">{label.YourCompanyDetails}</h2>
                        <p class="body-regular gray-700">{label.CompanyDetailsMsg}</p>
                        <div class="mb-3 body-regular">
                            <label for="companyField1" class="form-label">{label.postalCodeLabel}</label>
                            <input type="text" class="form-control" id="companyField1" placeholder={label.postalCodeLabel} value={accountPostalCode} onchange={handleChangeAccountPostalCode}>
                        </div>
                        <button class="btn btn-primary w-100 my-3" disabled={firstStepDisabled} onclick={handleSubmitStepOne}>{label.Continue}</button>
                    </template>
                    <template if:false={verified}>
                        <div class="bg-secondary-subtle border-secondary rounded mb-4 p-2 w-100 d-flex flex-row"> 
                            <i class="bi bi-x-circle text-danger me-2"></i>
                            <p class="body-regular m-0">
                                {label.verificationErrorHeading}
                                <br>
                                {label.verificationErrorMessage}
                            </p>
                        </div>
                    </template>
                </div>
                <div class="col-md-6 d-none d-md-block right-section">
                    <!-- Placeholder for future marketing content -->
                </div>
            </div>
        </div>
        <!-- Step Two -->
        <div class="container-fluid" if:true={stepTwo}>
            <div class="row">
                <div class="col-12 col-md-6 left-section mt-5">
                    <!-- Back to where? -->
                    <!--a href="#" class="back-arrow" onclick={handleBack}>
                        <lightning-icon icon-name="utility:back" alternative-text="Back"></lightning-icon>
                    </a-->
                    <h2 class="heading-2">{label.YourPersonalDetails}</h2>
                    <p class="body-regular gray-700">{label.PersonalDetailsMsg}</p>
                        <div class="mb-3 body-regular">
                            <label for="personalField1" class="form-label">{label.firstNameLabel}</label>
                            <input type="text" class="form-control" id="personalField1" placeholder={label.firstNameLabel} value={firstName} onchange={handleChangeFirstName}>
                        </div>
                        <div class="mb-3 body-regular">
                            <label for="personalField2" class="form-label">{label.lastNameLabel}</label>
                            <input type="text" class="form-control" id="personalField2" placeholder={label.lastNameLabel} value={lastName} onchange={handleChangeLastName}>
                        </div>
                        <div class="mb-3 body-regular">
                            <label for="personalField3" class="form-label">{label.emailLabel}</label>
                            <input type="text" class="form-control" id="personalField3" placeholder={label.emailLabel} value={email} readonly>
                        </div>
                        <div class="mb-3 body-regular">
                            <label for="personalField4" class="form-label">{label.phoneLabel}</label>
                            <input type="text" class="form-control" id="personalField4" placeholder={label.phoneLabel} value={phone} onchange={handleChangePhone}>
                        </div>
                        <button class="btn btn-primary" disabled={secondStepDisabled} onclick={handleSubmitStepTwo}>{label.completeProfile}</button>
                </div>
                <div class="col-md-6 d-none d-md-block right-section">
                    <!-- Placeholder for future marketing content -->
                </div>
            </div>
        </div>
        <!-- Step Three - Postal Verification -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepThreePostal}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.profileCreationPostalHeader}</p>
                <p class="body-regular gray-700">{label.profileCreationPostalMsg}</p>
            </div>
        </div>
        <!-- Step Three - Success -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepThreeSuccess}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.profileCreationSuccessHeader}</p>
                <p class="body-regular gray-700">{label.profileCreationSuccessMsg}</p>
            </div>
        </div>
        <!-- Step Three - Unauthorized -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepThreeUnauthorized}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.profileCreationUnauthorizedHeader}</p>
                <p class="body-regular gray-700">{label.profileCreationUnauthorizedMsg}</p>
            </div>
        </div>
        <!-- Step Three - Already active -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepThreeAlreadyActive}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.profileCreationAlreadyActiveHeading}</p>
                <p class="body-regular gray-700">{label.profileCreationAlreadyActiveMessage}</p>
            </div>
        </div>
        <!-- Step Three - Already active -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepThreeNotActivated}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.profileCreationUnauthorizedHeader}</p>
                <p class="body-regular gray-700">{label.notActivated}</p>
            </div>
        </div>
        <!-- Step Three - Already active -->
        <div class="modal d-flex flex-column justify-content-center align-items-center" if:true={stepThreeNoAccountFound}>
            <div class="modal-card p-5 text-align-center">
                <p class="heading-2">{label.profileCreationUnauthorizedHeader}</p>
                <p class="body-regular gray-700">{label.accountUnknown}</p>
            </div>
        </div>
    </template>
</template>
