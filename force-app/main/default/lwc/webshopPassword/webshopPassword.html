<template>
    <p class="password-requirements">
        <span>{label.passwordMinCharacters}</span><br>
        <span>{label.passwordCharacters}</span>
    </p>
    <p>
        <label for="password" class="form-label body-regular">{label.password}</label>
        <input type="password" class="form-control" data-id="password" placeholder={label.password} onchange={handleChangePassword} required>
        <lightning-icon icon-name="action:approval" if:true={passwordCorrect}></lightning-icon>
        <lightning-icon icon-name="action:close" if:true={passwordIncorrect}></lightning-icon>
    </p>
    <p>
        <label for="repeatPassword" class="form-label body-regular">{label.repeatPassword}</label>
        <input type="password" class="form-control" data-id="repeatPassword" placeholder={label.repeatPassword} onchange={handleChangeRepeatPassword} required>
        <lightning-icon icon-name="action:approval" if:true={passwordRepeatCorrect}></lightning-icon>
        <lightning-icon icon-name="action:close" if:true={passwordRepeatIncorrect}></lightning-icon>
    </p>
</template>
