<template>
    <c-webshop-toast></c-webshop-toast>
    <div class="background"></div>
    <!--lightning-spinner if:true={isLoading} alternative-text="Loading" size="small"></lightning-spinner-->
    <div class="d-flex justify-content-center align-items-center">
        <div if:true={isLoading} class="spinner-border text-black-50" role="status"></div>
    </div>
    <template if:false={isLoading}>
        <div class="sidebar d-none d-lg-block">
            <c-webshop-my-area-sidebar active-element="My_Invoices__c"></c-webshop-my-area-sidebar>
        </div>
        <div class="container-fluid content-zone">
            <div class="row"> 
                <div class="col-auto d-none d-lg-block">
                    <!--c-webshop-my-area-sidebar active-element="My_Invoices__c"></c-webshop-my-area-sidebar-->
                </div>
                <div class="col-12 col-lg-11 p-0 px-md-4">
                    <div class="content-area">
                        <template if:true={showInvoiceInfo}>
                            <!-- HEADER -->
                            <div class="row d-flex justify-content-start mb-3">
                                <p class="link text-decoration-none cursor-pointer" onclick={handleBackToList}><i class="bi bi-arrow-left"></i> {label.backToList}</p>
                            </div>
                            <div class="row d-flex justify-content-between align-items-center mb-3">
                                <div class="col-12 col-md-6">
                                    <p class="heading-3">{label.invoiceNo}: {invoiceInfo.ERPInvoiceNumber__c}</p>
                                    <span if:true={invoiceInfo.isCancelled} class="bg-primary-subtle border border-primary rounded text-dark components-badge-h6 p-1 ms-2">{label.cancelled}</span>
                                </div>
                                <div class="col-12 col-md-2 d-flex justify-content-end">
                                    <!--button onclick={handleReinvoice} class="btn btn-primary w-100">{label.invoiceAgain}</button-->
                                </div>
                            </div>
                            <!-- LEFT SIDE -->
                            <div class="row d-flex justify-content-between">
                                <div class="col-12 col-md-7 pe-3">
                                    <div class="bg-white rounded p-4">
                                        <template if:true={hasProducts}>
                                            <h3 class="body-medium gray-700 border-bottom pb-3">{label.totalItems}: {invoiceProductsCount}</h3>
                                            <template for:each={invoiceProducts} for:item="invoiceItem">
                                                <div class="border-bottom container mb-3 p-0" key={invoiceItem.invoiceProduct.Id}>
                                                    <template if:true={invoiceItem.hasProduct}>
                                                        <div class="row justify-content-between py-1 px-0">
                                                            <div if:true={invoiceItem.hasImage} class="col-3 no-print">
                                                                <img src={invoiceItem.imageUrl} class="cart-product-image cursor-pointer" alt={invoiceItem.invoiceProduct.Product2.Name} data-productid={invoiceItem.invoiceProduct.Product2Id} onclick={handleNavigateToProduct} >
                                                            </div>
                                                            <div if:false={invoiceItem.hasImage} class="col-3 no-print">
                                                                <div class="cart-product-image"></div>
                                                            </div>
                                                            <div class="col-6 d-flex flex-column justify-content-between">
                                                                <p class="body-medium d-flex flex-column text-wrap">
                                                                    <span class="cursor-pointer hover-underline" data-productid={invoiceItem.invoiceProduct.Product2Id} onclick={handleNavigateToProduct}>{invoiceItem.invoiceProduct.Product2.Name}</span>
                                                                    <span class="components-badge-h3" if:true={showPrices}>{invoiceItem.price}&nbsp;{invoiceInfo.CurrencyIsoCode}</span>
                                                                </p>
                                                                <p class="body-small gray-700 text-wrap">{invoiceItem.invoiceProduct.Product2.PackageUnit__c}</p>
                                                                <p class="body-small gray-700">{invoiceItem.invoiceProduct.Quantity}</p>
                                                            </div>
                                                            <div class="col" style="position:relative">
                                                                <button class="wishlist-icon btn btn-link p-0 text-decoration-none text-dark cursor-pointer" data-productid={invoiceItem.invoiceProduct.Product2Id} if:false={invoiceItem.inWishlist} onclick={addProductToWishlist}>
                                                                    <i class="bi bi-heart"></i>
                                                                    <i class="bi bi-heart-fill"></i>
                                                                </button>
                                                                <button class="wishlist-icon-added btn btn-link p-0 text-decoration-none text-dark cursor-pointer" data-productid={invoiceItem.invoiceProduct.Product2Id} if:true={invoiceItem.inWishlist} onclick={removeFromWishlist}>
                                                                    <!--i class="bi bi-heart"></i-->
                                                                    <i class="bi bi-heart-fill"></i>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template> 
                                        </template>
                                        <template if:false={hasProducts}>
                                            <div class="border-bottom container mb-3 p-0" key={invoiceItem.invoiceProduct.Id}>
                                                <div class="row gx-1 py-1 px-0">
                                                    <p class="body-medium text-wrap">{label.noProducts}</p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                
                                <!-- RIGHT SIDE -->
                                <div class="col-12 col-md-5 pb-3">
                                    <div class="bg-white rounded p-4">
                                        <div class="w-100 mb-3">
                                            <p class="body-medium m-0">{label.invoiceDate}</p>
                                            <p class="body-regular gray-700">{invoiceInfo.InvoiceDate}</p>
                                        </div>
                                        <hr>
                                        <div class="w-100 mb-3">
                                            <p class="body-medium m-0">{label.outlet}</p>
                                            <p class="body-regular gray-700">{invoiceInfo.BillingAccount.Name}</p>
                                        </div>
                                        <hr>
                                        <div class="w-100 mb-3">
                                            <p class="body-medium m-0">{label.shippingAddress}</p>
                                            <p class="body-regular gray-700">{invoiceInfo.Street}, {invoiceInfo.PostalCode} {invoiceInfo.City}</p>
                                        </div>
                                        <hr>
                                        <div class="w-100 mb-3">
                                            <p class="body-medium m-0">{label.purchaser}</p>
                                            <p class="body-regular gray-700">{invoiceInfo.CreatedBy.FirstName} {invoiceInfo.CreatedBy.LastName}</p>
                                        </div>
                                        <hr>
                                        <!-- SUMMARY -->
                                        <template  if:true={showPrices}>
                                            <p class="body-medium">{label.summary}</p>
                                            <p class="d-flex justify-content-between large-medium pt-3"><span>{label.total}</span><span>{invoiceInfo.TotalAmount}&nbsp;{invoiceInfo.CurrencyIsoCode}</span></p>
                                            <hr>
                                        </template>
                                        <p class="large-medium">{label.needHelp}</p>
                                        <p class="body-regular cursor-pointer" onclick={handleContactUs}><i class="bi bi-envelope"></i> {label.contactUs}</p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div> 
    </template>
    <c-webshop-contact-modal></c-webshop-contact-modal>
</template>
