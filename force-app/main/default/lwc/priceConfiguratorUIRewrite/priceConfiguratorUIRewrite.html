<template>
    <lightning-quick-action-panel header={label.priceConfiguratorHeader}>  
        <template if:true={isLoaded}>
            <lightning-spinner alternative-text="Loading" size="small" if:true={isLoading}></lightning-spinner>
            <template if:false={isChain}>
                <!-- Body -->    
                <!-- New Customer Banner -->
                <c-lwc-messaging-utility
                    if:true={newCustomerWithInherited}
                    message-body={label.newCustomerWithInheritedWarning}
                    message-type="inline"
                    message-variant="warning"
                    icon-name="utility:report_issue"
                    show-message=true
                    show-icon=true
                    >
                </c-lwc-messaging-utility>
                <!-- End New Customer Banner -->
        
                <!-- Closed Banner -->
                <c-lwc-messaging-utility
                    if:true={oppClosed}
                    message-body={label.closedOpp}
                    message-type="inline"
                    message-variant="warning"
                    icon-name="utility:report_issue"
                    show-message=true
                    show-icon=true
                    >
                </c-lwc-messaging-utility>
                <!-- End Closed Banner -->
                <template if:false={isChainKannMuss}>
                    <template if:true={showIndexConditionSecondWarning}>
                        <lightning-layout class="slds-m-bottom_xx-small">
                            <lightning-layout-item size="12" padding="horizontal-small"> 
                                <c-lwc-messaging-utility
                                    message-body={label.indexConditionSecondWarning}
                                    message-type="inline"
                                    message-variant="warning"
                                    icon-name="utility:report_issue"
                                    show-message=true
                                    show-icon=true
                                    >
                                </c-lwc-messaging-utility>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                </template>
                <div class="section slds-p-vertical_small">
                    <lightning-layout>
                        <lightning-layout-item if:false={indexConditionMissing} size="12" padding="horizontal-small">
                            <p class="title-bold">{label.basicInformation}</p>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout>
                        <lightning-layout-item if:false={indexConditionMissing} size="6" padding="horizontal-small">
                            <lightning-input 
                            type="text" 
                            label={label.industry} 
                            value={industry} 
                            disabled>
                        </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item if:false={isDependentChainMember} size="6" padding="horizontal-small">
                            <lightning-combobox style={indexConditionPicklistStyle} readonly={hasNoOwnConfiguration} options={yesNoOptions} value={indexConditionPreset} onchange={handleChangeIndexConditionPre} label={label.indexConditionPre}></lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="horizontal-small" if:true={isDependentChainMember}>
                            <lightning-input if:false={hasIndexConditionFromParamsAndNoChain} type="number" field-level-help={dynamicIndexConditionLabel} step="0.01" value={params.indexCondition} onchange={handleChangeIndexCondition} label={label.indexCondition} required disabled></lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout>
                        <lightning-layout-item if:false={indexConditionMissing} size="6" padding="horizontal-small">
                            <lightning-combobox value={params.discount} options={discountOptions} onchange={handleDiscount} label={label.discountLabel}></lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="horizontal-small" if:false={isDependentChainMember}>
                            <lightning-input if:false={hasIndexConditionFromParamsAndNoChain} type="number" field-level-help={dynamicIndexConditionLabel} step="0.01" value={params.indexCondition} readonly={isDependentChainMember} onchange={handleChangeIndexCondition} label={label.indexCondition} required></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item if:true={isDependentChainMember} size="6" padding="horizontal-small">
                            <lightning-input type="date" value={params.validFrom} onchange={handleChangeValidFrom} label={label.validFrom} required></lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout>
                        <lightning-layout-item if:true={hasIndexConditionFromParamsAndNoChain} size="6" padding="horizontal-small">
                            <lightning-input if:false={isDependentChainMember} type="date" value={params.validFrom} onchange={handleChangeValidFrom} label={label.validFrom} required></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="horizontal-small">
                            <lightning-combobox if:false={indexConditionMissing} value={params.hasDigitalRequired} options={yesNoOptions} onchange={handleDigitalRequired} label={label.digitalRequired}></lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item if:false={hasIndexConditionFromParamsAndNoChain} size="6" padding="horizontal-small">
                            <lightning-input if:false={isDependentChainMember} type="date" value={params.validFrom} onchange={handleChangeValidFrom} label={label.validFrom} required></lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                    <template if:true={hasIndexConditionFromParamsAndNoChain}> <!--if:true={hasIndexConditionFromParamsAndNoChain}-->
                        <lightning-layout class="slds-m-bottom_xx-small">
                            <lightning-layout-item size="2" padding="horizontal-small">
                                &nbsp;
                            </lightning-layout-item>
                            <lightning-layout-item size="8" padding="horizontal-small" class="slds-m-top-small"> 
                                <c-lwc-messaging-utility
                                    message-body={indexConditionFirstWarningLabel}
                                    message-type="inline"
                                    message-variant="warning"
                                    icon-name="utility:report_issue"
                                    show-message=true
                                    show-icon=true
                                    >
                                </c-lwc-messaging-utility>
                            </lightning-layout-item>
                            <lightning-layout-item size="2" padding="horizontal-small">
                                &nbsp;
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout class="slds-m-bottom_xx-small">
                            <lightning-layout-item size="5" padding="horizontal-small">
                                &nbsp;
                            </lightning-layout-item>
                            <lightning-layout-item size="1" padding="horizontal-small">
                                <lightning-button label={label.yes} onclick={handleRejectIndexConditionFromParams}></lightning-button>
                            </lightning-layout-item>
                            <lightning-layout-item size="1" padding="horizontal-small">
                                <lightning-button label={label.no} onclick={handleAcceptIndexConditionFromParams}></lightning-button>
                            </lightning-layout-item>
                            <lightning-layout-item size="5" padding="horizontal-small">
                                &nbsp;
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                    <!--lightning-layout>
                        <lightning-layout-item if:false={isDependentChainMember} size="6" padding="horizontal-small">
                            <lightning-input type="date" value={params.validFrom} onchange={handleChangeValidFrom} label={label.validFrom} required></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="horizontal-small">
                            &nbsp;
                        </lightning-layout-item>
                    </lightning-layout-->
                </div>

                                        <lightning-input if:true={hasCoffeeType} type="number" step="1" value={params.coffeeWkzRuntime} data-fieldname="coffeeWkzRuntime" onchange={handleParamChange} label={label.runtimeInMonths}></lightning-input>
                                        <!-- Tee WKZ Laufzeit --> 
                                        <lightning-input if:true={hasTeaNoCoffeeType} type="number" step="1" value={params.teaWkzRuntime} data-fieldname="teaWkzRuntime" onchange={handleParamChange} label={label.runtimeInMonths}></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        <!-- Coffee Amount -->
                                        <lightning-input if:true={hasCoffeeType} type="number" step="1" value={params.coffeeWkzOneTimeAmount} data-fieldname="coffeeWkzOneTimeAmount" onchange={handleParamChange} label={label.refundVolumeKg}></lightning-input>
                                        <!-- Tee WKZ Menge -->  
                                        <lightning-input if:true={hasTeaNoCoffeeType} type="number" step="1" value={params.teaWkzOneTimeAmount} data-fieldname="teaWkzOneTimeAmount" onchange={handleParamChange} label={label.refundVolumeEuro}></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>    
                                <!-- Row 5 -->
                                <lightning-layout>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        <!-- Coffee One-Time Refund -->
                                        <lightning-input if:true={hasCoffeeType} type="number" step="1" value={params.coffeeWkzOneTimeRefund} data-fieldname="coffeeWkzOneTimeRefund" onchange={handleParamChange} label={label.oneTimeRefund}></lightning-input>
                                        <!-- Tee WKZ Vergütung -->  
                                        <lightning-input if:true={hasTeaNoCoffeeType} type="number" step="1" value={params.teaWkzOneTimeRefund} data-fieldname="teaWkzOneTimeRefund" onchange={handleParamChange} label={label.oneTimeRefund}></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        &nbsp;
                                    </lightning-layout-item>
                                </lightning-layout> 
                                <!-- Row 6 -->
                                <lightning-layout>
                                    <lightning-layout-item size="12" padding="horizontal-small" class="slds-p-top_medium" style="margin-top: 5px;">
                                        <!-- Annual WKZ Titel -->
                                        <p if:true={hasCoffeeType} class="title-bold slds-m-right_small">{label.refundWkzAnnualCoffee}</p>
                                        <!-- Tee WKZ Jährlich Titel -->
                                        <p if:true={hasTeaNoCoffeeType} class="title-bold slds-m-right_small">{label.refundWkzAnnualTea}</p>  
                                    </lightning-layout-item>
                                </lightning-layout> 
                                <!-- Row 7  -->
                                <lightning-layout>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        <!-- Coffee Annual Refund -->   
                                        <lightning-input if:true={hasCoffeeType} type="number" step="1" value={params.coffeeWkzAnnualRefund} data-fieldname="coffeeWkzAnnualRefund" onchange={handleParamChange} label={label.annualRefund}></lightning-input>
                                        <!-- Tee WKZ Jährlich Vergütung -->  
                                        <lightning-input if:true={hasTeaNoCoffeeType} type="number" step="1" value={params.teaWkzAnnualRefund} data-fieldname="teaWkzAnnualRefund" onchange={handleParamChange} label={label.annualRefund}></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        &nbsp;
                                    </lightning-layout-item>
                                </lightning-layout>
                                
                                <!-- divider between sections  -->
                                    <lightning-layout>
                                        <lightning-layout-item size="12" class="slds-m-top_large">
                                            <hr class="slds-m-vertical_small"/>
                                        </lightning-layout-item>
                                    </lightning-layout>

                                <!-- Row 8  -->
                                <lightning-layout>
                                    <lightning-layout-item size="12" padding="horizontal-small" class="slds-p-top_medium">
                                        <!-- RV kaffee Titel -->
                                        <p if:true={hasCocoaCoffeeTeaQuantities} class="title-bold slds-m-right_small">{label.refundTea}</p>
                                    </lightning-layout-item>
                                </lightning-layout> 
                                <template if:true={hasCoffeeAndTeaType}>
                                    <!-- Row 9 -->
                                    <lightning-layout>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                            <!-- Tea Refund Type -->
                                            <lightning-combobox if:true={hasCocoaCoffeeTeaQuantities} value={params.teaRefundType} options={teaTypeOptions} onchange={handleChangeTeaType} label={label.refundTeaType}></lightning-combobox>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                            <!-- Tea Refund Step -->
                                            <lightning-input if:true={hasCocoaCoffeeTeaQuantities} type="number" step="1" value={params.teaRefundLevel} data-fieldname="teaRefundLevel" onchange={handleParamChange} label={label.refundTeaLevel}></lightning-input>
                                        </lightning-layout-item>
                                    </lightning-layout>
                                    <!-- Row 10 -->
                                    <lightning-layout>
                                        <lightning-layout-item size="12" padding="horizontal-small" class="slds-p-top_medium" style="margin-top: 20px;">
                                        <!-- Tee WKZ Einmalig Titel -->
                                            <p if:true={hasTeaType} class="title-bold slds-m-right_small">{label.refundWkzOneTimeTea}</p> 
                                        </lightning-layout-item>
                                    </lightning-layout>
                                    <!-- Row 11 -->
                                    <lightning-layout>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                        <!-- Tee WKZ Laufzeit --> 
                                            <lightning-input if:true={hasTeaType} type="number" step="1" value={params.teaWkzRuntime} data-fieldname="teaWkzRuntime" onchange={handleParamChange} label={label.runtimeInMonths}></lightning-input>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                        <!-- Tee WKZ Menge -->  
                                            <lightning-input if:true={hasTeaType} type="number" step="1" value={params.teaWkzOneTimeAmount} data-fieldname="teaWkzOneTimeAmount" onchange={handleParamChange} label={label.refundVolumeEuro}></lightning-input>
                                        </lightning-layout-item>
                                    </lightning-layout>
                                    <!-- Row 12 -->
                                        <lightning-layout>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                            <lightning-input if:true={hasTeaType} type="number" step="1" value={params.teaWkzOneTimeRefund} data-fieldname="teaWkzOneTimeRefund" onchange={handleParamChange} label={label.oneTimeRefund}></lightning-input>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                            &nbsp;
                                        </lightning-layout-item>
                                    </lightning-layout>
                                    <!-- Row 13 -->
                                    <lightning-layout>
                                        <lightning-layout-item size="12" padding="horizontal-small" class="slds-p-top_medium" style="margin-top: 5px;">
                                            <!-- Tee WKZ Jährlich Titel -->
                                            <p if:true={hasTeaType} class="title-bold slds-m-right_small">{label.refundWkzAnnualTea}</p>    
                                        </lightning-layout-item>
                                    </lightning-layout>
                                    <!-- Row 14 -->
                                    <lightning-layout>
                                        <!-- Tee WKZ Jährlich Vergütung --> 
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                            <lightning-input if:true={hasTeaType} type="number" step="1" value={params.teaWkzAnnualRefund} data-fieldname="teaWkzAnnualRefund" onchange={handleParamChange} label={label.annualRefund}></lightning-input>
                                            </lightning-layout-item> 
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                            &nbsp;
                                        </lightning-layout-item>
                                    </lightning-layout>
                                </template>
                            </template>
                        </lightning-accordion-section>
                        <!-- End Refund -->

                        <!-- Additional Agreements -->
                        <lightning-accordion-section name="AdditionalAgreements" label={label.additionalAgreementsSection}>
                            <!--template if:true={params.showAdditionalAgreements}-->
                                    <lightning-input type="checkbox" checked={params.additionalQualityVisit} onchange={handleChangeAdditionalQualityVisit} label={label.additionalAgreementsQualityVisit}></lightning-input>
                                    <template if:true={params.additionalQualityVisit}>
                                        <lightning-combobox  class="slds-p-vertical_small" type="toggle" options={intervalOptions} value={params.additionalQualityVisitInterval} onchange={handleChangeAdditionalQualityVisitInterval} label={label.interval}></lightning-combobox><!--br /-->
                                        <lightning-input type="date" value={params.additionalQualityVisitInitial} onchange={handleChangeAdditionalQualityVisitInitial} label={label.firstCheck}></lightning-input><br />
                                        <lightning-input type="toggle" checked={params.additionalQualityVisitSettingRequested} onchange={handleChangeAdditionalQualityVisitSettingRequested} label={label.settingRequested}></lightning-input>
                                    </template>
                                    <lightning-input type="checkbox" checked={params.additionalFrameLease} onchange={handleChangeFrameLease} label={label.additionalAgreementsFrame}></lightning-input>
                                    <lightning-input-rich-text  class="slds-p-vertical_small" if:true={params.additionalFrameLease} value={params.additionalFrameLeaseText} onchange={handleChangeFrameLeaseText} label={label.additionalAgreementsFrameRich}></lightning-input-rich-text>
                                    <lightning-input type="checkbox" checked={params.additionalOther} onchange={handleChangeAdditionalOther} label={label.additionalAgreementsOther}></lightning-input>
                                    <lightning-input-rich-text  class="slds-p-vertical_small" if:true={params.additionalOther} value={params.additionalOtherText} onchange={handleChangeAdditionalOtherText} label={label.additionalAgreementsOtherRich}></lightning-input-rich-text>
                                    <lightning-input type="checkbox" checked={params.additionalOfferTasting} onchange={handleChangeOfferTasting} label={label.additionalAgreementsOfferTasting}></lightning-input>
                                    <lightning-input type="checkbox" checked={params.additionalOfferFinancing} onchange={handleChangeOfferFinancing} label={label.additionalAgreementsOfferFinancing}></lightning-input>
                                    <lightning-input type="checkbox" checked={params.additionalOfferTraining} onchange={handleChangeOfferTraining} label={label.additionalAgreementsOfferTraining}></lightning-input>
                               
                            <!--/template-->
                        </lightning-accordion-section>
                        <!-- End Additional Agreements -->
                        <!--Simulation-->
                        <lightning-accordion-section name="Simulation" label={label.simulationSection}> 
                            <template if:true={showSimulation}>
                                <lightning-layout>
                                    <lightning-layout-item size="12" padding="horizontal-small">
                                        <p class="title-bold slds-m-right_small">{label.simulateGrowth}</p>
                                    </lightning-layout-item>
                                </lightning-layout>
                                <lightning-layout>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        <lightning-combobox value={params.simulatedRevenue} options={simRevOptions} onchange={handleChangeSimulatedRevenue} label={label.simulatedRevenue}></lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="horizontal-small">
                                        <lightning-combobox value={params.growthPercent} options={growthOptions} onchange={handleChangeGrowthPercent} label={label.growthInPercent}></lightning-combobox>               
                                    </lightning-layout-item>
                                </lightning-layout>
                            </template>
                        </lightning-accordion-section>
                    </lightning-accordion>
                    <!-- End Simulation-->
                </template>
                <!-- End Body -->
                <div slot="footer">
                    <lightning-layout>
                        <lightning-layout-item size="6">
                            <!--template if:true={displayErrors.quantityMismatch}>
                                <div class="section-warning slds-p-vertical_small">
                                    <div padding="around-small" class="slds-notify slds-notify_alert slds-alert_error" role="alert">{label.quantityMismatchWarning}</div>
                                </div>
                            </template-->
                            <template if:true={displayErrors.noProductsSelected}>
                                <div class="section-warning slds-p-vertical_small">
                                    <div padding="around-small" class="slds-notify slds-notify_alert slds-alert_error" role="alert">{label.errorNoProducts}</div>
                                </div>
                            </template>
                        </lightning-layout-item>
                        <lightning-layout-item size="6">
                            <lightning-button variant="neutral" label={label.cancel} onclick={handleCancel}></lightning-button>
                            <lightning-button if:false={isQuoteContext} variant="brand-outline" label={label.createAndContinue} class="slds-m-left_x-small" onclick={handleCreate} disabled={createDisabled}></lightning-button>
                            <lightning-button variant="brand" label={createAndCloseLabel} class="slds-m-left_x-small" onclick={handleCreateAndClose} disabled={createDisabled}></lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
            </template>
            <template if:true={isChain}>
                <!-- Body -->    
                <!-- New Customer Banner -->
                <c-lwc-messaging-utility
                    message-body={label.chainWarning}
                    message-type="inline"
                    message-variant="warning"
                    icon-name="utility:report_issue"
                    show-message=true
                    show-icon=true
                    >
                </c-lwc-messaging-utility>
            </template>
        </template>
    </lightning-quick-action-panel>
</template>
